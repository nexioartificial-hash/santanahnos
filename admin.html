<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Santana Hnos.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0d3318',
                        'primary-dark': '#0a2912',
                        'primary-darker': '#071f0d',
                        gold: '#c19a3d',
                        'gold-light': '#d4af5a',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .tab-active { background: #0d3318; color: #c19a3d; border-color: #c19a3d; }
        .tab-inactive { background: transparent; color: #9ca3af; border-color: transparent; }
        .tab-inactive:hover { color: #d4af5a; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 w-full max-w-sm shadow-2xl">
            <div class="text-center mb-8">
                <img src="logo.png" alt="Santana Hnos." class="w-20 h-20 mx-auto mb-4 opacity-80">
                <h1 class="text-2xl font-bold text-white">Santana Hnos.</h1>
                <p class="text-gray-400 text-sm mt-1">Panel de Administracion</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Usuario</label>
                    <input type="text" id="login-user" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-gold" placeholder="admin" autocomplete="username">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Contrasena</label>
                    <input type="password" id="login-pass" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-gold" placeholder="********" autocomplete="current-password">
                </div>
                <p id="login-error" class="text-red-400 text-sm hidden">Usuario o contrasena incorrectos</p>
                <button type="submit" class="w-full bg-gold hover:bg-gold-light text-primary-darker font-bold py-3 rounded-lg transition-all">
                    Ingresar
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="hidden">
        <!-- Top bar -->
        <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Logo" class="w-8 h-8 opacity-80">
                <h1 class="text-lg font-bold">Santana Hnos. <span class="text-gold text-sm font-normal">Admin</span></h1>
            </div>
            <button onclick="logout()" class="text-gray-400 hover:text-red-400 text-sm transition-colors">Cerrar sesion</button>
        </header>

        <!-- Tabs -->
        <nav class="bg-gray-900 border-b border-gray-800 px-6 flex gap-1">
            <button onclick="switchTab('consultas')" id="tab-consultas" class="tab-active px-5 py-3 text-sm font-medium border-b-2 transition-all rounded-t-lg">
                Consultas <span id="badge-consultas" class="ml-1 bg-gold/20 text-gold text-xs px-2 py-0.5 rounded-full">0</span>
            </button>
            <button onclick="switchTab('clientes')" id="tab-clientes" class="tab-inactive px-5 py-3 text-sm font-medium border-b-2 transition-all rounded-t-lg">
                Nuevos Clientes <span id="badge-clientes" class="ml-1 bg-gray-700 text-gray-400 text-xs px-2 py-0.5 rounded-full">0</span>
            </button>
        </nav>

        <!-- Content -->
        <main class="p-6 max-w-7xl mx-auto">

            <!-- Consultas Tab -->
            <div id="content-consultas">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold">Consultas del Sitio Web</h2>
                    <button onclick="clearQueries()" class="text-sm text-gray-500 hover:text-red-400 transition-colors">Limpiar todo</button>
                </div>
                <div id="queries-list" class="space-y-3"></div>
                <p id="queries-empty" class="text-gray-500 text-center py-12 hidden">No hay consultas nuevas.</p>
            </div>

            <!-- Nuevos Clientes Tab -->
            <div id="content-clientes" class="hidden">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
                    <h2 class="text-xl font-bold">Nuevos Clientes (Leads)</h2>
                    <div class="flex gap-3">
                        <label class="cursor-pointer bg-gold hover:bg-gold-light text-primary-darker font-bold px-4 py-2 rounded-lg text-sm transition-all">
                            Importar JSON
                            <input type="file" accept=".json" id="import-json" class="hidden" onchange="importLeads(this)">
                        </label>
                        <button onclick="exportLeadsCSV()" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm border border-gray-700 transition-all">Exportar CSV</button>
                        <button onclick="clearLeads()" class="text-sm text-gray-500 hover:text-red-400 transition-colors px-3">Limpiar</button>
                    </div>
                </div>

                <!-- Stats -->
                <div id="leads-stats" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6"></div>

                <!-- Search/Filter -->
                <div class="flex flex-col sm:flex-row gap-3 mb-4">
                    <input type="text" id="leads-search" placeholder="Buscar por nombre, telefono, localidad..." class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-gold" oninput="renderLeads()">
                    <select id="leads-zona" class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-gold" onchange="renderLeads()">
                        <option value="">Todas las zonas</option>
                    </select>
                </div>

                <!-- Table -->
                <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="border-b border-gray-800 text-left">
                                    <th class="px-4 py-3 text-gray-400 font-medium">Nombre</th>
                                    <th class="px-4 py-3 text-gray-400 font-medium">Localidad</th>
                                    <th class="px-4 py-3 text-gray-400 font-medium">Telefono</th>
                                    <th class="px-4 py-3 text-gray-400 font-medium">Direccion</th>
                                    <th class="px-4 py-3 text-gray-400 font-medium">Rating</th>
                                    <th class="px-4 py-3 text-gray-400 font-medium">Web</th>
                                </tr>
                            </thead>
                            <tbody id="leads-table"></tbody>
                        </table>
                    </div>
                </div>
                <p id="leads-count" class="text-gray-500 text-sm mt-3 text-center"></p>
                <p id="leads-empty" class="text-gray-500 text-center py-12 hidden">No hay leads cargados. Importa un archivo JSON del scraper.</p>
            </div>
        </main>
    </div>

<script>
    // ======== AUTH ========
    var ADMIN_USER = 'admin';
    var ADMIN_PASS = 'santana2024';

    function checkAuth() {
        if (sessionStorage.getItem('sh_auth') === 'true') {
            showPanel();
        }
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var u = document.getElementById('login-user').value.trim();
        var p = document.getElementById('login-pass').value;
        if (u === ADMIN_USER && p === ADMIN_PASS) {
            sessionStorage.setItem('sh_auth', 'true');
            showPanel();
        } else {
            document.getElementById('login-error').classList.remove('hidden');
        }
    });

    function logout() {
        sessionStorage.removeItem('sh_auth');
        location.reload();
    }

    function showPanel() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        loadConsultas();
        loadLeads();
    }

    // ======== TABS ========
    function switchTab(tab) {
        document.getElementById('content-consultas').classList.toggle('hidden', tab !== 'consultas');
        document.getElementById('content-clientes').classList.toggle('hidden', tab !== 'clientes');
        document.getElementById('tab-consultas').className = tab === 'consultas' ? 'tab-active px-5 py-3 text-sm font-medium border-b-2 transition-all rounded-t-lg' : 'tab-inactive px-5 py-3 text-sm font-medium border-b-2 transition-all rounded-t-lg';
        document.getElementById('tab-clientes').className = tab === 'clientes' ? 'tab-active px-5 py-3 text-sm font-medium border-b-2 transition-all rounded-t-lg' : 'tab-inactive px-5 py-3 text-sm font-medium border-b-2 transition-all rounded-t-lg';
    }

    // ======== CONSULTAS ========
    function loadConsultas() {
        var queries = JSON.parse(localStorage.getItem('sh_queries') || '[]');
        var list = document.getElementById('queries-list');
        var empty = document.getElementById('queries-empty');
        document.getElementById('badge-consultas').textContent = queries.length;

        if (queries.length === 0) {
            list.innerHTML = '';
            empty.classList.remove('hidden');
            return;
        }
        empty.classList.add('hidden');
        list.innerHTML = queries.map(function(q) {
            var d = new Date(q.date);
            var dateStr = d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
            return '<div class="bg-gray-900 border border-gray-800 rounded-xl p-5">' +
                '<div class="flex items-start justify-between mb-2">' +
                    '<h3 class="font-bold text-white">' + esc(q.name) + '</h3>' +
                    '<span class="text-gray-500 text-xs">' + dateStr + '</span>' +
                '</div>' +
                '<p class="text-gray-400 text-sm mb-3">' + esc(q.message) + '</p>' +
                '<div class="flex gap-4 text-xs text-gray-500">' +
                    '<span>Tel: ' + esc(q.phone) + '</span>' +
                    '<span>Email: ' + esc(q.email) + '</span>' +
                '</div>' +
                '<div class="mt-3 flex gap-2">' +
                    '<a href="https://wa.me/54' + esc(q.phone.replace(/\D/g,'')) + '" target="_blank" class="text-xs bg-green-900/50 text-green-400 px-3 py-1 rounded-lg hover:bg-green-900 transition-colors">WhatsApp</a>' +
                    '<a href="mailto:' + esc(q.email) + '" class="text-xs bg-blue-900/50 text-blue-400 px-3 py-1 rounded-lg hover:bg-blue-900 transition-colors">Email</a>' +
                '</div>' +
            '</div>';
        }).join('');
    }

    function clearQueries() {
        if (confirm('Borrar todas las consultas?')) {
            localStorage.removeItem('sh_queries');
            loadConsultas();
        }
    }

    // ======== LEADS / NUEVOS CLIENTES ========
    var leads = [];

    function loadLeads() {
        leads = JSON.parse(localStorage.getItem('sh_leads') || '[]');
        updateLeadsBadge();
        renderLeads();
        updateZonaFilter();
        updateStats();
    }

    function updateLeadsBadge() {
        document.getElementById('badge-clientes').textContent = leads.length;
    }

    function updateZonaFilter() {
        var zonas = {};
        leads.forEach(function(l) { if (l.zona) zonas[l.zona] = true; });
        var sel = document.getElementById('leads-zona');
        var val = sel.value;
        sel.innerHTML = '<option value="">Todas las zonas</option>';
        Object.keys(zonas).sort().forEach(function(z) {
            sel.innerHTML += '<option value="' + esc(z) + '">' + esc(z) + '</option>';
        });
        sel.value = val;
    }

    function updateStats() {
        var stats = document.getElementById('leads-stats');
        var total = leads.length;
        var conTel = leads.filter(function(l) { return l.telefono; }).length;
        var conWeb = leads.filter(function(l) { return l.sitio_web; }).length;
        var conRating = leads.filter(function(l) { return parseFloat(l.rating) >= 4; }).length;

        stats.innerHTML =
            statCard('Total Leads', total, 'text-gold') +
            statCard('Con Telefono', conTel, 'text-green-400') +
            statCard('Con Sitio Web', conWeb, 'text-blue-400') +
            statCard('Rating 4+', conRating, 'text-yellow-400');
    }

    function statCard(label, value, color) {
        return '<div class="bg-gray-900 border border-gray-800 rounded-xl p-4 text-center">' +
            '<p class="text-2xl font-bold ' + color + '">' + value + '</p>' +
            '<p class="text-gray-500 text-xs mt-1">' + label + '</p>' +
        '</div>';
    }

    function renderLeads() {
        var search = (document.getElementById('leads-search').value || '').toLowerCase();
        var zona = document.getElementById('leads-zona').value;
        var empty = document.getElementById('leads-empty');
        var table = document.getElementById('leads-table');
        var count = document.getElementById('leads-count');

        if (leads.length === 0) {
            table.innerHTML = '';
            empty.classList.remove('hidden');
            count.textContent = '';
            return;
        }
        empty.classList.add('hidden');

        var filtered = leads.filter(function(l) {
            if (zona && l.zona !== zona) return false;
            if (search) {
                var hay = (l.nombre + ' ' + l.localidad + ' ' + l.telefono + ' ' + l.direccion).toLowerCase();
                return hay.indexOf(search) !== -1;
            }
            return true;
        });

        var show = filtered.slice(0, 200);
        table.innerHTML = show.map(function(l) {
            var rating = l.rating ? l.rating + ' (' + (l.cantidad_resenas || '0') + ')' : '-';
            var web = l.sitio_web ? '<a href="' + esc(l.sitio_web) + '" target="_blank" class="text-blue-400 hover:underline">Ver</a>' : '-';
            var tel = l.telefono || '-';
            if (l.telefono) {
                tel = '<a href="https://wa.me/54' + l.telefono.replace(/\D/g,'') + '" target="_blank" class="text-green-400 hover:underline">' + esc(l.telefono) + '</a>';
            }
            return '<tr class="border-b border-gray-800/50 hover:bg-gray-800/30">' +
                '<td class="px-4 py-3 text-white font-medium">' + esc(l.nombre) + '</td>' +
                '<td class="px-4 py-3 text-gray-400">' + esc(l.localidad || '') + '</td>' +
                '<td class="px-4 py-3">' + tel + '</td>' +
                '<td class="px-4 py-3 text-gray-500 text-xs max-w-[200px] truncate">' + esc(l.direccion || '') + '</td>' +
                '<td class="px-4 py-3 text-gray-400">' + rating + '</td>' +
                '<td class="px-4 py-3">' + web + '</td>' +
            '</tr>';
        }).join('');

        var suffix = filtered.length > 200 ? ' (mostrando 200)' : '';
        count.textContent = filtered.length + ' leads' + suffix;
    }

    function importLeads(input) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var data = JSON.parse(e.target.result);
                if (!Array.isArray(data)) { alert('El archivo no contiene un array JSON'); return; }
                // Merge with existing, dedup by nombre+direccion
                var existing = {};
                leads.forEach(function(l) {
                    existing[(l.nombre || '').toLowerCase() + '|' + (l.direccion || '').toLowerCase()] = true;
                });
                var added = 0;
                data.forEach(function(l) {
                    var key = (l.nombre || '').toLowerCase() + '|' + (l.direccion || '').toLowerCase();
                    if (!existing[key] && l.nombre) {
                        leads.push(l);
                        existing[key] = true;
                        added++;
                    }
                });
                localStorage.setItem('sh_leads', JSON.stringify(leads));
                updateLeadsBadge();
                renderLeads();
                updateZonaFilter();
                updateStats();
                alert('Importados ' + added + ' nuevos leads. Total: ' + leads.length);
            } catch(err) {
                alert('Error al leer el archivo: ' + err.message);
            }
        };
        reader.readAsText(file);
        input.value = '';
    }

    function exportLeadsCSV() {
        if (leads.length === 0) { alert('No hay leads para exportar'); return; }
        var headers = ['nombre','direccion','localidad','zona','telefono','telefono2','celular_whatsapp','email','sitio_web','rating','cantidad_resenas','categoria_google','horarios','instagram','facebook','google_maps_url'];
        var csv = headers.join(';') + '\n';
        leads.forEach(function(l) {
            csv += headers.map(function(h) {
                var v = (l[h] || '').toString().replace(/"/g, '""');
                return '"' + v + '"';
            }).join(';') + '\n';
        });
        var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'leads_santana_hnos.csv';
        a.click();
    }

    function clearLeads() {
        if (confirm('Borrar todos los leads?')) {
            leads = [];
            localStorage.removeItem('sh_leads');
            updateLeadsBadge();
            renderLeads();
            updateStats();
        }
    }

    function esc(str) {
        if (!str) return '';
        var d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    // Init
    checkAuth();
</script>
</body>
</html>
